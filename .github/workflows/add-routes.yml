name: Add routes from issue

# Open an issue (template "Add route from Discord paste"), paste the Discord text, submit.
# Only issues opened or edited by the repo owner are processed. The issue text is never
# interpolated into a shell command; build/add_routes.py reads it from the event file as data.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: add-routes
  cancel-in-progress: false

jobs:
  add:
    if: github.event.issue.user.login == 'mallek' && github.actor == 'mallek'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4.2.2

      - name: Parse paste and write routes
        id: add
        run: |
          set +e
          python3 build/add_routes.py --site . --event "$GITHUB_EVENT_PATH" --summary "$RUNNER_TEMP/summary.md"
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.add.outputs.status == '0'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gpx routes.json index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "routes: add from issue #$ISSUE_NUMBER"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Rebuild Pages
        if: steps.add.outputs.status == '0'
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true

      - name: Reply on the issue
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/summary.md" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/summary.md"
          else
            echo "The workflow failed before it could parse the text. Check the Actions log." > "$RUNNER_TEMP/summary.md"
            gh issue comment "$ISSUE_NUMBER" --body-file "$RUNNER_TEMP/summary.md"
          fi
          if [ "${{ steps.add.outputs.status }}" = "0" ]; then
            gh issue close "$ISSUE_NUMBER" --reason completed
          fi
